<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C4A3E">
<meta name="description" content="Placar de mesa para Truco e Fodinha — funciona offline e salva a partida no navegador.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Placar de Mesa — Truco &amp; Fodinha</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231C4A3E'/><text y='24' x='16' font-size='20' text-anchor='middle'>%E2%99%A0</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Inter:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>

<main class="shell">

  <header class="marca">
    <div class="marca__naipes" aria-hidden="true">
      <span class="vermelho">&hearts;</span> &spades; <span class="vermelho">&diams;</span> &clubs;
    </div>
    <h1 class="marca__titulo">Marcador pro Henrique não roubar</h1>
    <p class="marca__sub">Truco &amp; Fodinha</p>
  </header>

  <!-- Avisos de partida em andamento, montados por js/menu.js -->
  <div id="retomadas"></div>

  <nav class="menu-jogos" aria-label="Escolha o jogo">
    <a class="card-jogo" href="truco.html">
      <span class="card-jogo__selo" aria-hidden="true">&spades;</span>
      <h2 class="card-jogo__nome">Truco</h2>
      <p class="card-jogo__desc">Contagem simples de pontos por time, com desfazer.</p>
    </a>

    <a class="card-jogo" href="fodinha.html">
      <span class="card-jogo__selo" aria-hidden="true">&hearts;</span>
      <h2 class="card-jogo__nome">Fodinha</h2>
      <p class="card-jogo__desc">Rodadas sobe-e-desce, apostas e a conta de pedrinhas.</p>
    </a>
  </nav>

</main>

<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/menu.js"></script>
</body>
</html>
