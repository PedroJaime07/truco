<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C4A3E">
<meta name="mobile-web-app-capable" content="yes">
<title>Fodinha — Placar de Mesa</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231C4A3E'/><text y='24' x='16' font-size='20' text-anchor='middle'>%E2%99%A5</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Inter:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>

<!-- ===================== SETUP ===================== -->
<main class="shell" id="tela-setup" hidden>

  <header class="topo">
    <a class="btn-voltar" href="index.html" aria-label="Voltar ao menu">&larr;</a>
    <h1 class="topo__titulo">Fodinha</h1>
  </header>

  <section class="painel">
    <h2 class="painel__titulo">Quantos jogadores?</h2>
    <div class="contador-qtd">
      <button type="button" class="btn-redondo" id="menos-jogadores" aria-label="Menos um jogador">−</button>
      <input class="entrada entrada--numero" id="qtd-jogadores" type="number" inputmode="numeric"
             step="1" min="2" max="20" value="4" aria-label="Quantidade de jogadores">
      <button type="button" class="btn-redondo" id="mais-jogadores" aria-label="Mais um jogador">+</button>
    </div>
  </section>

  <section class="painel">
    <h2 class="painel__titulo">Nome dos jogadores</h2>
    <div class="lista-nomes" id="nomes-jogadores"></div>
  </section>

  <section class="painel">
    <h2 class="painel__titulo">Máximo de cartas por rodada</h2>
    <div class="contador-qtd">
      <button type="button" class="btn-redondo" id="menos-cartas" aria-label="Menos uma carta">−</button>
      <input class="entrada entrada--numero" id="max-cartas" type="number" inputmode="numeric"
             step="1" min="1" max="20" value="10" aria-label="Máximo de cartas por rodada">
      <button type="button" class="btn-redondo" id="mais-cartas" aria-label="Mais uma carta">+</button>
    </div>
    <p class="painel__nota" id="nota-max-cartas"></p>
  </section>

  <button type="button" class="btn btn--principal btn--bloco" id="iniciar-fodinha"
          style="margin-bottom:16px">Começar partida</button>

</main>

<!-- ===================== JOGO ===================== -->
<main class="shell shell--com-barra" id="tela-jogo" hidden>

  <header class="topo">
    <a class="btn-voltar" href="index.html" aria-label="Voltar ao menu">&larr;</a>
    <h1 class="topo__titulo">Fodinha</h1>
  </header>

  <div class="abas" role="tablist" aria-label="Seções do jogo">
    <button type="button" class="aba" role="tab" id="aba-rodada" data-aba="rodada" aria-selected="true">Rodada</button>
    <button type="button" class="aba" role="tab" id="aba-ranking" data-aba="ranking" aria-selected="false">Ranking</button>
    <button type="button" class="aba" role="tab" id="aba-historico" data-aba="historico" aria-selected="false">Histórico</button>
  </div>

  <!-- ---------- Aba: rodada atual ---------- -->
  <section id="painel-rodada" role="tabpanel" aria-labelledby="aba-rodada">
    <div class="rodada-topo">
      <div class="rodada-topo__info">
        <p class="rodada-topo__rotulo">Rodada atual</p>
        <p class="rodada-topo__cartas" id="rodada-cartas">1 carta</p>
        <p class="rodada-topo__dir" id="rodada-direcao"></p>
      </div>
      <button type="button" class="btn btn--fantasma btn--pequeno" id="editar-cartas">Ajustar</button>
    </div>

    <p class="aviso-soma" id="aviso-soma" hidden></p>

    <div id="lista-jogadas"></div>
  </section>

  <!-- ---------- Aba: ranking ---------- -->
  <section id="painel-ranking" role="tabpanel" aria-labelledby="aba-ranking" hidden>
    <div class="ranking" id="lista-ranking"></div>

    <section class="painel" style="margin-top:16px">
      <h2 class="painel__titulo">Partida</h2>
      <div class="pilha-8">
        <button type="button" class="btn btn--bloco" id="editar-max">Máximo de cartas por rodada</button>
        <button type="button" class="btn btn--bloco" id="trocar-jogadores">Trocar jogadores</button>
        <button type="button" class="btn btn--perigo btn--bloco" id="reiniciar">Reiniciar partida</button>
      </div>
      <p class="painel__nota">Vence quem tiver <strong>menos pedrinhas</strong>. O jogo não tem fim: parem quando quiserem.</p>
    </section>
  </section>

  <!-- ---------- Aba: histórico ---------- -->
  <section id="painel-historico" role="tabpanel" aria-labelledby="aba-historico" hidden>
    <div class="historico" id="lista-historico"></div>
  </section>

</main>

<div class="barra-acoes" id="barra-jogo" hidden>
  <div class="barra-acoes__interno">
    <button type="button" class="btn btn--madeira" id="desfazer-rodada">↺ Desfazer</button>
    <button type="button" class="btn btn--principal btn--largo" id="fechar-rodada">Fechar rodada</button>
  </div>
</div>

<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/fodinha.js"></script>
</body>
</html>
